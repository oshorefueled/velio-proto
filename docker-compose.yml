services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      POSTGRES_DB: velio
      VELIO_APP_PASSWORD: ${VELIO_APP_PASSWORD:-velio_app_dev}
      VELIO_MIGRATOR_PASSWORD: ${VELIO_MIGRATOR_PASSWORD:-velio_migrator_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velio"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4.5
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
